<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierro y Colmillo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 3h26v15L16 30 3 18z' fill='%236aa83f' stroke='%231b140f' stroke-width='2'/%3E%3Cpath d='M9 22l2-9 3 7zM23 22l-2-9-3 7z' fill='%23fff7dc'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0c0a08; color: #efe6d2;
    font: 14px/1.35 "Segoe UI", system-ui, sans-serif; user-select: none; }
  #app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 36px 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 26px; padding: 0 12px;
    background: linear-gradient(#4a3d2b, #2b2318); border-bottom: 2px solid #8a7345; font-weight: 600; }
  header .res { display: flex; align-items: center; gap: 7px; min-width: 90px; }
  header .dot { width: 13px; height: 13px; border: 1px solid #1b140f; }
  header .res.full span:last-child { color: #ff7a66; }
  header .spacer { flex: 1; }
  aside { display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden;
    background: linear-gradient(90deg, #2b2318, #3a2f20); border-right: 2px solid #8a7345; }
  #mini { width: 216px; height: 216px; flex: none; border: 2px solid #8a7345; background: #000; cursor: pointer; }
  #info { flex: 1; min-height: 0; overflow: auto; background: #1d1811; border: 1px solid #5c4c30; padding: 8px; }
  #info p { margin-top: 6px; }
  .one { display: flex; gap: 8px; align-items: center; }
  .one canvas { border: 1px solid #8a7345; flex: none; }
  .multi { display: flex; flex-wrap: wrap; gap: 3px; }
  .multi button { padding: 0; width: 36px; background: #000; border: 1px solid #5c4c30; display: block; }
  .multi canvas { display: block; }
  .multi i { display: block; height: 3px; background: #4fd13a; }
  .bar { height: 9px; background: #000; border: 1px solid #8a7345; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: #7fc4ff; }
  #cmds { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 68px; gap: 4px; height: 212px; flex: none; }
  .cmd { position: relative; padding: 0; border: 2px solid #8a7345; background: #1d1811; overflow: hidden; }
  .cmd canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmd kbd { position: absolute; right: 2px; bottom: 2px; }
  .cmd:hover { border-color: #ffe08a; }
  .cmd.on { border-color: #6dff5a; }
  .cmd.off canvas { filter: grayscale(1) brightness(0.45); }
  .cmd.poor canvas { filter: brightness(0.6) sepia(0.4); }
  kbd { font: 700 11px/1 monospace; background: #000c; border: 1px solid #8a7345; border-radius: 3px; padding: 2px 4px; color: #ffe08a; }
  main { position: relative; overflow: hidden; }
  #view { width: 100%; height: 100%; display: block; }
  #log { position: absolute; left: 12px; top: 10px; pointer-events: none; font-weight: 600; text-shadow: 1px 1px 2px #000, 0 0 6px #000; }
  #log .bad { color: #ff8a70; }
  #modehint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; pointer-events: none; text-shadow: 1px 1px 3px #000; color: #ffe08a; }
  #tip { position: absolute; left: 8px; bottom: 10px; width: 270px; padding: 8px 10px; background: #1d1811f2; border: 1px solid #8a7345; pointer-events: none; }
  #tip p { color: #cfc4ac; margin-top: 4px; font-size: 13px; }
  #tip em, .enemy { color: #ff8a70; font-style: normal; }
  .g { color: #ffd84a; } .w { color: #d6a46a; } .mana { color: #7fc4ff; } .dim { color: #a89d86; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: linear-gradient(#5a4a33, #3a2f20);
    border: 1px solid #8a7345; border-radius: 4px; padding: 5px 12px; }
  button:hover { filter: brightness(1.18); }
  #screen { position: fixed; inset: 0; display: flex; overflow: auto; padding: 16px;
    background: radial-gradient(ellipse at center, #3a4a2acc, #0c0a08f2 75%); }
  .panel { margin: auto; background: linear-gradient(#2f261a, #1d1811); border: 3px solid #8a7345; border-radius: 8px;
    padding: 22px 26px; box-shadow: 0 14px 50px #000c; }
  .menu { width: 600px; max-width: 100%; }
  .help { width: 640px; max-width: 100%; }
  .help ol { margin: 8px 0 12px 20px; }
  .small { width: 360px; display: flex; flex-direction: column; gap: 9px; text-align: center; }
  h1 { font: 800 40px/1.1 Georgia, serif; text-align: center; color: #ffe08a; text-shadow: 0 3px 0 #1b140f; letter-spacing: 1px; }
  h1 i { color: #8fd05a; font-weight: 400; }
  h1.win { color: #8fe06a; } h1.lose { color: #ff7a66; }
  h2 { font: 700 24px Georgia, serif; color: #ffe08a; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; color: #cfc4ac; margin-bottom: 14px; }
  .factions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .faction { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border-width: 3px; }
  .faction canvas { width: 100%; height: auto; }
  .faction b { font: 700 19px Georgia, serif; }
  .faction span { font-size: 12.5px; color: #cfc4ac; }
  .faction.human.on { border-color: #8fb4ff; background: linear-gradient(#2f4a7c, #1c2a48); }
  .faction.orc.on { border-color: #ff8a70; background: linear-gradient(#7c352a, #451d17); }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .row label { min-width: 50px; font-weight: 700; color: #ffe08a; }
  .row.center { justify-content: center; }
  .opt.on { border-color: #6dff5a; background: linear-gradient(#4d6a30, #2f451d); }
  .hint { font-size: 12.5px; color: #a89d86; margin: 4px 0 0 57px; }
  .big { font: 700 18px Georgia, serif; padding: 9px 28px; border-width: 2px; border-color: #ffe08a; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 3px 6px; border-bottom: 1px solid #4a3d2b; text-align: left; }
  td:first-child { color: #ffe08a; }
  .stats td:not(:first-child), .stats th { text-align: center; }
  @media (max-height: 640px) {
    aside { grid-column: 1; }
    #mini { width: 160px; height: 160px; align-self: center; }
    #cmds { grid-auto-rows: 50px; height: 158px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="res"><span class="dot" style="background:#ffd23a;border-radius:50%"></span><span class="g" id="gold">0</span></div>
    <div class="res"><span class="dot" style="background:#a5733f;border-radius:3px"></span><span class="w" id="wood">0</span></div>
    <div class="res" title="Alimento"><span class="dot" style="background:#e5604a;border-radius:50% 50% 50% 0"></span><span id="food">0 / 0</span></div>
    <button id="idle" class="hidden"></button>
    <div class="spacer"></div>
    <span id="clock">0:00</span>
    <button id="menubtn">Menú (F10)</button>
  </header>
  <aside>
    <canvas id="mini" width="216" height="216"></canvas>
    <div id="info"></div>
    <div id="cmds"></div>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div id="log"></div>
    <div id="modehint"></div>
    <div id="tip" class="hidden"></div>
  </main>
</div>
<div id="screen"></div>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/art.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
